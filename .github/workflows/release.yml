# Fires once per release: pushing a vX.Y.Z tag builds release binaries on
# all three OSes and uploads them as workflow artifacts.
# Release flow stays as-is: bump Cargo.toml version, commit, tag, push tag.
name: Release build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rust-hf-downloader-${{ runner.os }}
          path: target/release/rust-hf-downloader${{ runner.os == 'Windows' && '.exe' || '' }}
